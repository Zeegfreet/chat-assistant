components:
  parameters:
    PageParam:
      name: page
      in: query
      description: Número da página atual
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
    LimitParam:
      name: limit
      in: query
      description: Limite de linhas a a exibir
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    SearchParam:
      name: search
      in: query
      description: Texto chave de pesquisa
      required: false
      schema:
        type: string
    FilterParam:
      name: filter
      in: query
      description: Filtros adicionais
      required: false
      schema:
        type: object
        additionalProperties:
          oneOf:
            - type: number
            - type: string
            - type: object
              properties:
                $gt:
                  oneOf:
                    - type: number
                    - type: string
                      format: date-time
                $gte:
                  oneOf:
                    - type: number
                    - type: string
                      format: date-time
                $lt:
                  oneOf:
                    - type: number
                    - type: string
                      format: date-time
                $lte:
                  oneOf:
                    - type: number
                    - type: string
                      format: date-time
                $between:
                  type: array
                  minimum: 2
                  maximum: 2
                  oneOf:
                    - items:
                        type: number
                      example: [1, 10]
                    - items:
                        type: string
                        format: date-time
                      example: ["2026-05-06T10:00:00Z", "2026-05-07T10:00:00Z"]
                $in:
                  type: array

                    



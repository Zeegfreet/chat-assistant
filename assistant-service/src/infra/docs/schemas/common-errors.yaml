components:
  responses:
    AlreadyExistsError:
      description: "Conflict"
      content:
        application/json:
          schema:
            allOf: 
              - $ref: "./error-base-response.yaml#"
          examples:
            alreadyExistsError:
              summary: "Already Exists"
              value:
                success: false
                error: "ALREADY_EXISTS_ERROR"
                message: "Already exists a credential with the received name."
    UnauthorizedError:
      description: "Unauthorized"
      content:
        application/json:
          schema:
            allOf: 
              - $ref: "./error-base-response.yaml#"
          examples:
            sessionExpiredError:
              summary: "Session Expired"
              value:
                success: false
                error: "SESSION_EXPIRED_ERROR"
                message: "The received credentials is expired, re-create u`r session."
            accessDeniedError:
              summary: "Access Denied"
              value:
                success: false
                error: "ACCESS_DENIED_ERROR"
                message: "Access denied"
    ValidationError:
      description: "Bad Request"
      content:
        application/json:
          schema:
              $ref: "../schemas/error-base-response.yaml"
          examples:
              validationError:
                summary: Validation Error
                value:
                  success: false
                  error: VALIDATION_ERROR
                  message: "name: name is inválid"
    ValidationIdParamError:
      description: "Bad Request"
      content:
        application/json:
          schema:
              $ref: "../schemas/error-base-response.yaml"
          examples:
              validationError:
                summary: Validation Error
                value:
                  success: false
                  error: VALIDATION_ERROR
                  message: "id: id is not a number"
    NotFoundError:
      description: "Not Found"
      content:
        application/json:
          schema:
            $ref: "../schemas/error-base-response.yaml"
        examples:
          notFoundError:
            summary: Not Found Error
            value:
              success: false
              error: "NOT_FOUND_ERROR"
              message: "register not found with received id"
    UnknownError:
      description: "Unknown"
      content:
        application/json:
          schema:
            allOf: 
              - $ref: "./error-base-response.yaml#"
          examples:
            sessionExpiredError:
              summary: "Unknown"
              value:
                success: false
                error: "UNKNOWN_ERROR"
                message: "Internal Server Error."
